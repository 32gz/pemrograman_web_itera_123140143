<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pos Tugas Kampus</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <h1>Pos Tugas Kampus</h1>
    <div class="clock"><b id="jam">--:--:--</b><span id="tanggal"></span></div>
  </header>

  <section class="quote" aria-live="polite"><p id="kutipan">Memuat kutipan…</p><small id="penulis"></small></section>

  <div class="grid">
    <aside>
      <section class="card">
        <h2>Cuaca kampus ITERA</h2>
        <div class="temp" id="suhu">–</div>
        <div class="muted" id="cuaca">Memuat cuaca…</div>
        <div class="stats">
          <div><b id="sTotal">0</b><span class="muted">Total</span></div>
          <div><b id="sAktif">0</b><span class="muted">Aktif</span></div>
          <div><b id="sTelat">0</b><span class="muted">Telat</span></div>
        </div>
      </section>
    </aside>

    <main class="card">
      <h2>Daftar tugas</h2>
      <form id="formTugas">
        <input id="fJudul" placeholder="Judul tugas" required maxlength="80" aria-label="Judul tugas">
        <input id="fMk" placeholder="Mata kuliah" maxlength="40" aria-label="Mata kuliah">
        <input id="fTenggat" type="date" aria-label="Tenggat">
        <button class="primary" type="submit">Tambah</button>
      </form>
      <div class="filters" id="filter" role="group" aria-label="Filter">
        <button data-f="semua" aria-pressed="true">Semua</button>
        <button data-f="aktif" aria-pressed="false">Aktif</button>
        <button data-f="selesai" aria-pressed="false">Selesai</button>
      </div>
      <ul id="daftar"></ul>
      <p class="note" id="sumber"></p>
    </main>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

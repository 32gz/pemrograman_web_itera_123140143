<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kasir Kantin Kampus</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Kasir Kantin Kampus</h1>
  <p>Catat belanjaan, hitung diskon, dan kembalian dalam satu layar.</p>
</header>

<main>
  <section class="panel" aria-labelledby="judul-form">
    <h2 id="judul-form">Tambah barang</h2>
    <form id="form-barang" novalidate>
      <div class="field">
        <label for="nama">Nama barang</label>
        <input type="text" id="nama" placeholder="Contoh: Buku Tulis" autocomplete="off">
        <p class="error" id="err-nama" role="alert"></p>
      </div>
      <div class="field">
        <label for="harga">Harga satuan (Rp)</label>
        <input type="number" id="harga" placeholder="Minimal 500" step="any">
        <p class="error" id="err-harga" role="alert"></p>
      </div>
      <div class="field">
        <label for="qty">Jumlah</label>
        <input type="number" id="qty" placeholder="Minimal 1" step="any">
        <p class="error" id="err-qty" role="alert"></p>
      </div>
      <button type="submit" class="btn-main">Tambah ke keranjang</button>
    </form>
  </section>

  <section class="panel" aria-labelledby="judul-keranjang">
    <h2 id="judul-keranjang">Keranjang belanja</h2>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>No</th><th>Nama barang</th><th class="num">Harga satuan</th><th class="num">Qty</th><th class="num">Subtotal</th><th>Aksi</th></tr>
        </thead>
        <tbody id="isi-keranjang"></tbody>
      </table>
    </div>

    <div class="summary">
      <div class="line"><span>Total belanja</span><strong id="total-belanja">Rp 0</strong></div>

      <div class="promo-row">
        <input type="text" id="kode-promo" placeholder="Kode promo (HEMAT10)" aria-label="Kode promo" autocomplete="off">
        <button type="button" id="btn-promo">Pakai</button>
      </div>
      <p class="hint">Diskon 10% otomatis untuk belanja minimal Rp 50.000, atau gunakan kode HEMAT10.</p>
      <p class="error" id="err-promo" role="status"></p>

      <div class="line discount"><span id="label-diskon">Diskon</span><span id="nominal-diskon">- Rp 0</span></div>
      <div class="line grand"><span>Total akhir</span><span id="total-akhir">Rp 0</span></div>

      <div class="field" style="margin-top:10px">
        <label for="bayar">Uang bayar (Rp)</label>
        <input type="number" id="bayar" placeholder="Nominal uang diterima" step="any">
      </div>
      <div id="status-bayar" class="status" role="status" aria-live="polite"></div>
    </div>

    <button type="button" class="btn-reset" id="btn-reset">Transaksi baru</button>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
